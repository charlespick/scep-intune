name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod  # keep the toolchain in sync with the module

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0  # golangci-lint-action v9 requires golangci-lint v2.x; config in .golangci.yml

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # -race surfaces data races in the concurrent webhook handlers; -vet=all runs
      # the standard vet checks as part of the same pass.
      - name: Test
        run: go test -race -vet=all ./...

  # Known vulnerabilities in the module graph and the Go toolchain that the code
  # actually reaches. govulncheck is pinned to an exact version; `go run` checks
  # it against go.sum's source of truth, the Go checksum database.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # Full SCEP enrollment: step-ca -> bridge -> Intune mock, no Microsoft tenant.
  # Tools are downloaded from their official releases and checked against
  # sha256 hashes pinned in test/e2e/tools.sh.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: End-to-end test
        run: make e2e
