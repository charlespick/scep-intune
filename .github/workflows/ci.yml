name: CI

# Every run builds and smoke-tests the container image. A v<semver> tag on a commit on
# main is also released: the image goes to ghcr.io and a GitHub release records its digest.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/charlespick/scep-intune

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod  # keep the toolchain in sync with the module

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0  # golangci-lint-action v9 requires golangci-lint v2.x; config in .golangci.yml

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # -race surfaces data races in the concurrent webhook handlers; -vet=all runs
      # the standard vet checks as part of the same pass.
      - name: Test
        run: go test -race -vet=all ./...

  # Known vulnerabilities in the module graph and the Go toolchain that the code
  # actually reaches. govulncheck is pinned to an exact version; `go run` checks
  # it against go.sum's source of truth, the Go checksum database.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # Full SCEP enrollment: step-ca -> bridge -> Intune mock, no Microsoft tenant.
  # Tools are downloaded from their official releases and checked against
  # sha256 hashes pinned in test/e2e/tools.sh.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: End-to-end test
        run: make e2e

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      tags: ${{ steps.v.outputs.tags }}
    steps:
      # Full history, so the release check can see origin/main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: v
        run: |
          set -euo pipefail
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not v<semver>, e.g. v1.2.0 or v1.2.0-rc.1"
              exit 1
            fi
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              release=true
            else
              echo "::warning::$GITHUB_REF_NAME is not on main, so it is built but not released."
            fi
          else
            version="0.0.0-dev.${GITHUB_SHA::12}"
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          tags="$IMAGE:$version"
          if [ "$prerelease" = false ]; then tags="$tags,$IMAGE:latest"; fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "prerelease=$prerelease"
            echo "tags=$tags"
          } | tee -a "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: VERSION=${{ needs.version.outputs.version }}
          load: true
          tags: scep-intune:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: test/image-smoke.sh scep-intune:test

  # The pushed image is rebuilt here from the image job's cache, not copied from it.
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, lint, build-and-test, govulncheck, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ needs.version.outputs.tags }}
          cache-from: type=gha

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" "$kind" --generate-notes \
            --notes "Image: \`$IMAGE:$VERSION@$DIGEST\`"
